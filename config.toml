title = "Ilona Ixchel Loučka"
owner = "Ilona Ixchel Loučka"
copyright = "Ilona Ixchel Loučka"
baseURL = "https://ixchelone.dev/"
theme = "resume"
languageCode = "en-us"
enableGitInfo = true
timeZone = "Europe/Prague"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  brandName = "Ilona Ixchel Loučka"                                       # Display name shown in the navbar and metadata (falls back to site title if omitted)
  profileImage = "images/inguz.png"                                       # Navbar/profile image and its rendered dimensions
  profileImageWidth = 32
  profileImageHeight = 32
  resumePdfUrl = "https://ixchelone.dev/ilona-loucka.pdf"                 # Canonical URL to your CV/PDF (proxied for inline viewing).
  favicon = "icons/favicon.ico"                                           # Favicon path (served from /static)
  gitCommitPrefix = "https://github.com/ixchelone/resume/commit"          # Prefix for commit links shown on the site (GitHub commit URL base)

[params.colors]
  # Custom secondary theme accent
  secondary = "#C072FF"                                                 # or: "rgb(192,114,255)"
  secondaryContrast = "#000000"                                         # text color on top of the accent