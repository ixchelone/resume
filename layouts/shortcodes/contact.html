<section id="contact" class="resume-section">
  <div class="resume-section-content">
    <h2>Contact</h2>

    <div data-fs-success class="alert alert-success" role="status">
      Thank you! Your message has been sent successfully.
    </div>

    <div data-fs-error class="alert alert-danger" role="alert">
      Something went wrong. Please try again later.
    </div>

    <form id="contact-form">

      <div class="form-group">
        <label for="contact-name">Name</label>
        <input
          type="text"
          class="form-control"
          id="contact-name"
          name="name"
          autocomplete="name"
          required
          data-fs-field
        >
        <span data-fs-error="name"></span>
      </div>

      <div class="form-group">
        <label for="contact-email">Email</label>
        <input
          type="email"
          class="form-control"
          id="contact-email"
          name="email"
          autocomplete="email"
          required
          data-fs-field
        >
        <span data-fs-error="email"></span>
      </div>

      <div class="form-group">
        <label for="contact-subject">Subject</label>
        <input
          type="text"
          class="form-control"
          id="contact-subject"
          name="subject"
          required
          data-fs-field
        >
        <span data-fs-error="subject"></span>
      </div>

      <div class="form-group">
        <label for="contact-message">Message</label>
        <textarea
          class="form-control"
          id="contact-message"
          name="message"
          rows="6"
          required
          data-fs-field
        ></textarea>
        <span data-fs-error="message"></span>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        data-fs-submit-btn
      >
        Send message
      </button>

    </form>
  </div>
</section>

<script>
  window.formspree =
    window.formspree ||
    function () {
      (formspree.q = formspree.q || []).push(arguments);
    };

  formspree("initForm", {
    formElement: "#contact-form",
    formId: "xljbapva",
  });
</script>

<script src="https://unpkg.com/@formspree/ajax@1" defer></script>
