
name: Deploy Hugo site to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'assets/**'
      - 'archetypes/**'
      - 'content/**'
      - 'data/**'
      - 'i18n/**'
      - 'layouts/**'
      - 'static/**'
      - 'themes/**'
      - 'cloudflare/_worker.js'
      - 'config.toml'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    outputs:
      run: ${{ steps.diff.outputs.run }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        name: Detect relevant changes
        run: |
          BEFORE="${{ github.event.before }}"

          if [[ -z "$BEFORE" || "$BEFORE" == "0000000000000000000000000000000000000000" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- \
            assets/ \
            archetypes/ \
            content/ \
            data/ \
            i18n/ \
            layouts/ \
            static/ \
            themes/ \
            config.toml \
            cloudflare/_worker.js \
            .github/workflows/)"

          if [[ -n "$CHANGED" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-deploy:
    if: needs.changes.outputs.run == 'true'
    needs: changes

    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      HUGO_VERSION: 0.141.0
      HUGO_ENVIRONMENT: production
      HUGO_CACHEDIR: ${{ github.workspace }}/.hugo_cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Restore Hugo cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml') }}
          restore-keys: |
            ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-
            ${{ runner.os }}-hugo-

      - name: Build Hugo site
        run: |
          HUGO_LATEST_COMMIT="$(git rev-parse --short HEAD)" \
            hugo --gc --minify --enableGitInfo

      - name: Save Hugo cache
        if: always()
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.HUGO_CACHEDIR }}
          key: ${{ runner.os }}-hugo-${{ env.HUGO_VERSION }}-${{ hashFiles('config.toml') }}

      - name: Add Cloudflare Pages Worker
        run: |
          test -d public
          cp cloudflare/_worker.js public/_worker.js
          test -s public/_worker.js
          echo "Worker successfully added to Hugo output."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./public --project-name=ixchelone --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
